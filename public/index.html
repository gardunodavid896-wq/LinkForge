<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8eb8fc"><title>LinkForge — Mini Link It</title>
<link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script>
</head>
<body>
<main class="page">
  <header class="topline"><a class="logo" href="/" aria-label="LinkForge home"><span class="logo-symbol">↗</span> LinkForge</a><span class="tag">Small links. Big ideas.</span></header>
  <section class="hero" aria-label="Shorten a URL">
    <div class="form-card">
      <form id="link-form">
        <label for="long-url">Enter Your Long URL</label>
        <input id="long-url" name="url" type="url" placeholder="https://www.example.com/your-long-link" autocomplete="url" required>
        <label for="custom-alias" class="alias-label">Your Mini URL <span class="optional">(optional custom name)</span></label>
        <div class="alias-field"><div class="prefix" id="domain-prefix">yourdomain.com/</div><input id="custom-alias" name="alias" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}" placeholder="e.g. my-link" autocomplete="off" aria-label="Custom short URL ending"></div>
        <button id="create-button" class="primary" type="submit">Mini Link It <span aria-hidden="true">↗</span></button>
      </form>
      <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
    </div>
    <div class="tiny-note">✦ No extra steps. Just paste, shorten, and share.</div>
  </section>
  <section class="history" aria-labelledby="links-heading"><div class="history-title"><div><span class="eyebrow">YOUR COLLECTION</span><h2 id="links-heading">Your mini links <span class="count" id="link-count">0</span></h2></div><button class="refresh" id="refresh" type="button">↻ Refresh</button></div><div id="link-list" class="link-list"></div><p class="empty" id="empty">Your shortened links will appear here.</p></section>
  <footer>Made with ♡ by LinkForge</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
